name: Test policy YAML input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare output directory
        run: |
          rm -rf "$RUNNER_TEMP/runseal-policy-out"
          mkdir -p "$RUNNER_TEMP/runseal-policy-out"
      - id: action
        uses: .
        with:
          run: echo "policy-ok" > "${{ runner.temp }}/runseal-policy-out/policy.txt"
          policy: |
            fs:
              write:
                - ${{ runner.temp }}/runseal-policy-out
            network:
              mode: blocked
          verify-attestations: "false"
      - name: Assert file was written under policy
        run: |
          f="$RUNNER_TEMP/runseal-policy-out/policy.txt"
          if [ ! -f "$f" ]; then
            echo "FAIL: $f not found"
            exit 1
          fi
          content="$(cat "$f")"
          echo "content: $content"
          if [ "$content" != "policy-ok" ]; then
            echo "FAIL: unexpected content"
            exit 1
          fi
          echo "PASS"

name: Test invalid policy is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          run: echo "should not run"
          policy: |
            network:
              mode: wide-open
          verify-attestations: "false"
      - name: Assert action failed but setup installed tools
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported network.mode"
            exit 1
          fi
          if ! command -v runseal >/dev/null 2>&1; then
            echo "FAIL: setup did not install runseal (failure was not from policy validation)"
            exit 1
          fi
          echo "PASS"
